networks:
  dashboard-network:
    driver: bridge

services:
  postgres:
    image: postgres:18-alpine
    container_name: dashboard-postgres
    environment:
      POSTGRES_DB: dashboard
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1111
    ports:
      - "5432:5432"
    networks:
      - dashboard-network
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

   postgres-backup:
    image: postgres:18-alpine
    container_name: dashboard-postgres-backup
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: 1111
      PGDATABASE: dashboard
    volumes:
      - postgres_backups:/backups
      - ./backup-script.sh:/usr/local/bin/backup:ro
    command: |
      sh -c '
      while true; do
        echo "$(date): Running backup..."
        /usr/local/bin/backup
        echo "$(date): Cleaning old backups..."
        find /backups -name "*.sql.gz" -mtime +7 -delete
        echo "$(date): Sleeping 24 hours..."
        sleep 86400
      done
      '
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dashboard-network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: dashboard-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - uploads:/usr/share/nginx/html/uploads:ro
    depends_on:
      - api
      - web
    networks:
      - dashboard-network
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: DashBoard.Api/Dockerfile
    container_name: dashboard-api
    environment:
      - ASPNETCORE_URLS=http://+:5000  
      - FrontendUrl=https://localhost
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=dashboard;Username=postgres;Password=1111
    volumes:
      - uploads:/app/wwwroot/uploads
    expose:
      - "5000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dashboard-network
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: DashBoard.Web/Dockerfile
    container_name: dashboard-web
    environment:
      - ASPNETCORE_URLS=http://+:8080    # Оставлен 8080 для web
      - API_URL=http://api:5000           # Изменено на 5000
      - ASPNETCORE_ENVIRONMENT=Development
    expose:
      - "8080"                            # Оставлен 8080 для web
    depends_on:
      - api
    networks:
      - dashboard-network
    restart: unless-stopped

volumes:
  postgres_data:
  postgres_backups:
  uploads: