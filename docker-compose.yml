networks:
  dashboard-network:
    driver: bridge

services:
  postgres:
    image: postgres:18-alpine
    container_name: dashboard-postgres
    environment:
      POSTGRES_DB: dashboard
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1111
    ports:
      - "5432:5432"
    networks:
      - dashboard-network
    volumes:
      - postgres_data:/var/lib/postgresql/data

  nginx:
    image: nginx:alpine
    container_name: dashboard-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - api
      - web
    networks:
      - dashboard-network

  api:
    build:
      context: .
      dockerfile: DashBoard.Api/Dockerfile
    container_name: dashboard-api
    environment:
      - FrontendUrl=https://localhost
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=dashboard;Username=postgres;Password=1111
    depends_on:
      - postgres
    networks:
      - dashboard-network

  web:
    build:
      context: .
      dockerfile: DashBoard.Web/Dockerfile
    container_name: dashboard-web
    environment:
      - API_URL=http://api:8080
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      - api
    networks:
      - dashboard-network

volumes:
  postgres_data: